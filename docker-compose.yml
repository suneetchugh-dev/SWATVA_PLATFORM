# Swatva AI — full stack compose.
#
#   docker compose up -d --build       → brings up ALL services (postgres, qdrant,
#                                         backend, frontend)
#   docker compose --profile storage up -d --build  → also starts MinIO
#
# Frontend is served by Nginx on http://localhost:3000
# Backend  is served by Spring Boot on http://localhost:8080
# Nginx proxies /api/* → backend automatically inside the compose network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: swatva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-swatva_ai}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swatva_dev}
    ports:
      - "5432:5432"
    volumes:
      - swatva-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-swatva_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: swatva-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - swatva-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spring Boot backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swatva-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override localhost references so the backend reaches sibling containers
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-swatva_ai}
      QDRANT_HOST: qdrant
      S3_ENDPOINT: http://minio:9000
      CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:*,http://127.0.0.1:*,http://frontend:80,https://swatva.sahnirmaan.live,https://*.sahnirmaan.live,https://*.pages.dev"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── React/Vite frontend (Nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swatva-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # OPTIONAL — object storage for the /api/documents upload feature.
  # Not started by default. MinIO is no longer pullable from Docker Hub
  # (registry.min.io requires auth), and the app degrades gracefully without it.
  #
  # For local dev, either enable this with:
  #     docker compose --profile storage up -d --build
  # ...or point S3_* at Cloudflare R2 (S3-compatible, free tier) — recommended for prod.
  minio:
    image: minio/minio:latest
    container_name: swatva-minio
    restart: unless-stopped
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - swatva-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swatva-postgres-data:
  swatva-qdrant-data:
  swatva-minio-data:
