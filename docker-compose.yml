# Swatva AI — local backing services only.
# The Spring Boot app runs on the host (`mvn spring-boot:run`) for fast iteration.
#   docker compose up -d
#   mvn spring-boot:run
#
# Postgres is the only hard requirement. Qdrant and MinIO are optional: the app
# degrades gracefully (keyword search, document upload disabled) if they are down.

services:
  postgres:
    image: postgres:16-alpine
    container_name: swatva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-swatva_ai}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-swatva_dev}
    ports:
      - "5432:5432"
    volumes:
      - swatva-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-swatva_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: swatva-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - swatva-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OPTIONAL — object storage for the /api/documents upload feature.
  # Not started by default. MinIO is no longer pullable from Docker Hub
  # (registry.min.io requires auth), and the app degrades gracefully without it.
  #
  # For local dev, either enable this with:
  #     docker compose --profile storage up -d
  # ...or point S3_* at Cloudflare R2 (S3-compatible, free tier, and the
  # sahnirmaan.live nameservers are already on Cloudflare) — recommended for prod.
  minio:
    image: minio/minio:latest
    container_name: swatva-minio
    restart: unless-stopped
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - swatva-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swatva-postgres-data:
  swatva-qdrant-data:
  swatva-minio-data:
