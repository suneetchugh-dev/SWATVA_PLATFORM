spring:
  application:
    name: sahayak-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sahayak_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION_NAME:sahayak_schemes}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

logging:
  level:
    root: INFO
    in.sahayak: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

app:
  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    collection-name: ${QDRANT_COLLECTION_NAME:sahayak_schemes}
    use-tls: ${QDRANT_USE_TLS:false}
    initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:false}
  security:
    jwt:
      # Local-only fallback. Set JWT_SECRET to a distinct 32+ byte secret outside development.
      secret: ${JWT_SECRET:change-this-development-jwt-secret-to-a-secure-value-2026}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
