spring:
  application:
    name: swatva-ai

  # Loads local, untracked secrets from ./.env so `mvn spring-boot:run` and
  # `docker compose` share one source of truth. Copy .env.example -> .env.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swatva_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

  ai:
    openai:
      # Any OpenAI-compatible endpoint works: OpenRouter, Groq, or OpenAI itself.
      # Groq: OPENAI_BASE_URL=https://api.groq.com/openai  (no trailing /v1)
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api}

      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:openrouter/free}
          temperature: 0.7
          max-completion-tokens: 10000

      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:openai/text-embedding-3-large}
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:2048}

    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION_NAME:swatva_schemes}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:true}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

logging:
  level:
    root: INFO
    in.swatva: ${APP_LOG_LEVEL:INFO}

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

app:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      bucket: ${S3_BUCKET:swatva-documents}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}

  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    collection-name: ${QDRANT_COLLECTION_NAME:swatva_schemes}
    use-tls: ${QDRANT_USE_TLS:false}
    initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:true}

  security:
    jwt:
      # No default on purpose. Set JWT_SECRET in .env (32+ bytes) or the app refuses to start.
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}