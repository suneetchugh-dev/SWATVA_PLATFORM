<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Swatva AI finds every Indian government benefit scheme you qualify for, and tells you exactly what to do next."
    />

    <script>
      // Applied before first paint so the canvas never flashes the wrong theme.
      try {
        if (localStorage.getItem('swatva_theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
